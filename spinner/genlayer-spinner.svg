<svg
  class="gl-spinner"
  viewBox="0 0 48 48"
  xmlns="http://www.w3.org/2000/svg"
  role="status"
  aria-label="Loading"
>
  <style>
    .gl-spinner {
      width: 48px;
      height: 48px;
      display: block;
      overflow: visible;
    }
    /* The GenLayer mark: static, uncompromised, per brand usage rules */
    .gl-spinner__mark {
      fill: #110FFF;
    }
    /* Motion lives entirely in this orbiting ring — the mark itself never moves */
    .gl-spinner__ring {
      transform-origin: 24px 24px;
      animation: gl-spin 1.2s linear infinite;
    }
    .gl-spinner__arc {
      fill: none;
      stroke: #110FFF;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 42 200;
      opacity: 0.55;
    }
    @keyframes gl-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .gl-spinner__ring { animation-duration: 3s; }
    }
  </style>

  <g class="gl-spinner__ring">
    <circle class="gl-spinner__arc" cx="24" cy="24" r="19" />
  </g>

  <g class="gl-spinner__mark">
    <path d="M23.03,14.5 L13.89,33.5 L22.83,29.99 L19.62,28.35 L23.03,21.19 Z" />
    <path d="M24.97,14.5 L24.97,21.19 L28.38,28.35 L25.17,29.99 L34.11,33.5 Z" />
    <path d="M23.94,23.57 L22.07,27.5 L23.96,28.48 L25.95,27.5 L24.03,23.69 Z" />
  </g>
</svg>

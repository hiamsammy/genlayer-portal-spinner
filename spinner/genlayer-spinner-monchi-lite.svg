<svg
  class="gl-spinner-monchi"
  viewBox="0 0 48 48"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  role="status"
  aria-label="Loading"
>
  <style>
    .gl-spinner-monchi { width: 96px; height: 96px; display: block; overflow: visible; }
    .gl-layer--mark   { animation: gl-alt-mark 6s ease-in-out infinite; }
    .gl-layer--monchi { animation: gl-alt-monchi 6s ease-in-out infinite; }
    @keyframes gl-alt-mark   { 0%, 43% { opacity: 1; } 50%, 93% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes gl-alt-monchi { 0%, 43% { opacity: 0; } 50%, 93% { opacity: 1; } 100% { opacity: 0; } }
    .gl-spinner__mark { fill: #110FFF; }
    .gl-spinner__ring { transform-origin: 24px 24px; animation: gl-spin 1.2s linear infinite; }
    .gl-spinner__arc { fill: none; stroke: #110FFF; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 42 200; opacity: 0.55; }
    @keyframes gl-spin { to { transform: rotate(360deg); } }
    .gl-monchi-img { transform-box: fill-box; transform-origin: 50% 85%; animation: gl-monchi-bounce 0.6s ease-in-out infinite; }
    @keyframes gl-monchi-bounce {
      0%, 100% { transform: translateY(0)     rotate(-3deg) scale(1, 1); }
      25%      { transform: translateY(-1.5px) rotate(2deg)  scale(0.97, 1.03); }
      50%      { transform: translateY(0)     rotate(4deg)  scale(1.03, 0.97); }
      75%      { transform: translateY(-1.5px) rotate(-2deg) scale(0.97, 1.03); }
    }
    .gl-dust { fill: #110FFF; opacity: 0; animation: gl-dust-pop 0.6s ease-out infinite; }
    .gl-dust--b { animation-delay: 0.3s; }
    @keyframes gl-dust-pop { 0% { opacity: 0.5; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(-3px, 1.2px) scale(0.3); } }
    @media (prefers-reduced-motion: reduce) {
      .gl-spinner__ring { animation-duration: 3s; }
      .gl-layer--mark   { animation: none; opacity: 1; }
      .gl-layer--monchi { animation: none; opacity: 0; }
    }
  </style>

  <g class="gl-layer--mark">
    <g class="gl-spinner__ring">
      <circle class="gl-spinner__arc" cx="24" cy="24" r="19" />
    </g>
    <g class="gl-spinner__mark">
      <path d="M23.03,14.5 L13.89,33.5 L22.83,29.99 L19.62,28.35 L23.03,21.19 Z" />
      <path d="M24.97,14.5 L24.97,21.19 L28.38,28.35 L25.17,29.99 L34.11,33.5 Z" />
      <path d="M23.94,23.57 L22.07,27.5 L23.96,28.48 L25.95,27.5 L24.03,23.69 Z" />
    </g>
  </g>

  <g class="gl-layer--monchi">
    <circle class="gl-dust gl-dust--a" cx="18.5" cy="38.5" r="1" />
    <circle class="gl-dust gl-dust--b" cx="28.5" cy="38.5" r="1" />
    <image
      class="gl-monchi-img"
      href="./monchi.png"
      xlink:href="./monchi.png"
      x="11" y="8" width="26" height="30.8"
      preserveAspectRatio="xMidYMid meet"
    />
  </g>
</svg>
